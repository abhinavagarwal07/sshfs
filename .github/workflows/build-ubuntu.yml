name: build and test
on:
  push:
    branches: [master]

  pull_request:

  # Run CI on an arbitrary ref, e.g. refs/pull/123/merge for an outside PR
  # whose approval has expired. Results do not show up as checks on the PR.
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git ref to test, e.g. refs/pull/123/merge (optional)
        required: false

permissions:
  contents: read

# nothing here needs to save a cache, and dispatch runs may build other refs
cache-mode: read

concurrency:
  # dispatch runs get their own group so they can't cancel (or be cancelled by)
  # the run for the branch they were started from
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.git-ref || github.ref)) || github.ref }}
  cancel-in-progress: true

jobs:
  # Pin a dispatched ref to one commit, so every job tests the same thing even
  # if refs/pull/N/merge moves while the run is going. git-ref is a full ref
  # name or a commit SHA; resolving the SHA once and passing that to every
  # workflow keeps them on the same commit too.
  resolve:
    name: resolve ref
    if: github.event_name == 'workflow_dispatch' && inputs.git-ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          GIT_REF: ${{ inputs.git-ref }}
        run: |
          set -euo pipefail
          if [[ "$GIT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$GIT_REF
          else
            if [[ "$GIT_REF" != refs/* ]] || ! git check-ref-format "$GIT_REF"; then
              echo "git-ref has to be a full ref name or a 40-hex commit SHA" >&2
              exit 1
            fi
            # ls-remote takes a pattern, so pick the exact ref (and, for an
            # annotated tag, the commit it points to)
            refs=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                     "$GIT_REF" "$GIT_REF^{}")
            sha=$(printf '%s\n' "$refs" | awk -v want="$GIT_REF" '
              $2 == want { direct = $1; n++ }
              $2 == want "^{}" { peeled = $1; p++ }
              END { if (n != 1 || p > 1) exit 1; print p ? peeled : direct }')
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "can't resolve $GIT_REF" >&2
            exit 1
          fi
          echo "$GIT_REF is $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: resolve
    if: ${{ !failure() && !cancelled() }}
    name: ${{ matrix.compiler }} / ${{ matrix.buildtype }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        buildtype: [debugoptimized, release]
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Show tested commit
        run: |
          git rev-parse HEAD
          git cat-file -p HEAD | grep '^parent ' || true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang ninja-build libglib2.0-dev libfuse3-dev openssh-server openssh-client fuse3

      - name: Install meson
        run: pip3 install meson==1.12.1 pytest==9.1.1 pytest-timeout==2.4.0

      - name: Print tool versions
        run: |
          ${{ matrix.cc }} --version
          meson --version

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -q -N ""
          cat ~/.ssh/id_ed25519.pub > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh || sudo service ssh start
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes localhost true

      - name: Check FUSE availability
        run: |
          test -e /dev/fuse
          command -v fusermount3

      - name: Build
        env:
          CC: ${{ matrix.cc }}
        run: |
          meson setup build --buildtype=${{ matrix.buildtype }} -Dwerror=true
          ninja -C build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sshfs-${{ matrix.compiler }}-${{ matrix.buildtype }}
          path: build/sshfs
          if-no-files-found: ignore

      - name: Run tests
        timeout-minutes: 20
        run: |
          cd build
          python3 -m pytest --maxfail=99 --timeout=300 --junitxml=test-results.xml test/

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.compiler }}-${{ matrix.buildtype }}
          path: |
            build/test-results.xml
            build/meson-logs/

  strict-warnings:
    needs: resolve
    if: ${{ !failure() && !cancelled() }}
    name: ${{ matrix.compiler }} / strict warnings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            extra_cflags: "-Wformat=2 -Wformat-security -Wundef -Wstrict-prototypes -Wold-style-definition -Wmissing-prototypes -Wnull-dereference"
          - compiler: clang
            cc: clang
            extra_cflags: "-Wformat=2 -Wformat-security -Wundef -Wstrict-prototypes -Wold-style-definition -Wmissing-prototypes -Wnull-dereference"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Show tested commit
        run: |
          git rev-parse HEAD
          git cat-file -p HEAD | grep '^parent ' || true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang ninja-build libglib2.0-dev libfuse3-dev

      - name: Install meson
        run: pip3 install meson==1.12.1

      - name: Print tool versions
        run: |
          ${{ matrix.cc }} --version
          meson --version

      - name: Build with strict warnings
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: ${{ matrix.extra_cflags }}
        run: |
          meson setup build -Dwerror=true
          ninja -C build
