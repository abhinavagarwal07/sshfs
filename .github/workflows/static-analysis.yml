name: static analysis

on:
  push:
    branches: [master]

  pull_request:

  workflow_dispatch:
    inputs:
      git-ref:
        description: Commit SHA or full ref to test, e.g. refs/pull/123/merge (optional)
        required: false

permissions:
  contents: read

concurrency:
  # dispatch runs get their own group so they can't cancel (or be cancelled by)
  # the run for the branch they were started from
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.git-ref || github.ref)) || github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git-ref }}
          persist-credentials: false

      - name: Show tested commit
        run: |
          git rev-parse HEAD
          git cat-file -p HEAD | grep '^parent ' || true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy ninja-build pkg-config libglib2.0-dev libfuse3-dev
          pip3 install meson==1.12.1

      - name: Build compile database
        env:
          CC: clang
        run: meson setup build

      - name: Run clang-tidy
        run: run-clang-tidy -p build -warnings-as-errors='*' sshfs.c cache.c
