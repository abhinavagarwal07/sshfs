name: platform builds

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 7 1 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-compat:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            runner: ubuntu-latest
            run_tests: true
          - name: ubuntu-22.04
            runner: ubuntu-22.04
            run_tests: true
          - name: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
            run_tests: true
          - name: ubuntu-24.04-release
            runner: ubuntu-24.04
            buildtype: release
          - name: ubuntu-24.04-debug
            runner: ubuntu-24.04
            buildtype: debug
          - name: ubuntu-24.04-hardened
            runner: ubuntu-24.04
            extra_cflags: "-D_FORTIFY_SOURCE=3 -fstack-protector-strong"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc ninja-build pkg-config libglib2.0-dev libfuse3-dev ${{ matrix.run_tests && 'openssh-server openssh-client fuse3' || '' }}
          pip3 install meson ${{ matrix.run_tests && 'pytest pytest-timeout' || '' }}

      - name: Build
        env:
          CFLAGS: ${{ matrix.extra_cflags || '' }}
        run: |
          meson setup build ${{ matrix.buildtype && format('--buildtype={0}', matrix.buildtype) || '' }}
          ninja -C build

      - name: Setup SSH
        if: matrix.run_tests
        run: |
          chmod go-w ~
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -q -N ""
          cat ~/.ssh/id_ed25519.pub > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo sed -i 's/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh || sudo service ssh restart
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes localhost true

      - name: Check FUSE availability
        if: matrix.run_tests
        run: |
          test -e /dev/fuse
          command -v fusermount3

      - name: Run tests
        if: matrix.run_tests
        timeout-minutes: 20
        run: |
          cd build
          python3 -m pytest test/ --timeout=300 --maxfail=99 --junitxml=test-results.xml

      - name: Upload test results
        if: matrix.run_tests && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.name }}
          path: |
            build/test-results.xml
            build/meson-logs/

      - name: Upload build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: build-logs-${{ matrix.name }}
          path: build/meson-logs/

  alpine-musl:
    name: alpine-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build in Alpine container
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d sh -euxc '
            apk add --no-cache gcc musl-dev meson ninja pkgconf glib-dev fuse3-dev
            meson setup build-alpine
            ninja -C build-alpine
          '

      - name: Upload build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: build-logs-alpine-musl
          path: build-alpine/meson-logs/

  # quay.io garbage-collects old digests within weeks, so CentOS is a plain tag.
  # meson and ninja-build are only in CRB on EL9.
  centos-stream9:
    name: centos-stream9
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build in CentOS Stream 9 container
        run: |
          docker run --rm -v "$PWD:/work" -w /work quay.io/centos/centos:stream9 sh -euxc '
            dnf install -y --enablerepo=crb gcc meson ninja-build pkg-config glib2-devel fuse3-devel
            meson setup build-centos -Dwerror=true
            ninja -C build-centos
          '

      - name: Upload build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: build-logs-centos-stream9
          path: build-centos/meson-logs/

  fedora-latest:
    name: fedora-latest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build in Fedora container
        run: |
          docker run --rm -v "$PWD:/work" -w /work fedora:latest@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80 sh -euxc '
            dnf install -y gcc meson ninja-build pkg-config glib2-devel fuse3-devel
            meson setup build-fedora -Dwerror=true
            ninja -C build-fedora
          '

      - name: Upload build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: build-logs-fedora-latest
          path: build-fedora/meson-logs/

  # Advisory: runs the pytest suite against real FUSE + sshd in a privileged
  # container. A failure here does not fail the workflow.
  rpm-runtime:
    name: ${{ matrix.name }} (runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: centos-stream9
            image: quay.io/centos/centos:stream9
            dnf_args: --enablerepo=crb
          - name: fedora-latest
            image: fedora:latest@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test in container
        env:
          IMAGE: ${{ matrix.image }}
          DNF_ARGS: ${{ matrix.dnf_args }}
        run: |
          # FUSE mounts need CAP_SYS_ADMIN and no AppArmor profile, not --privileged
          docker run --rm --cap-add SYS_ADMIN --security-opt apparmor=unconfined \
            --device /dev/fuse -e DNF_ARGS \
            -v "$PWD:/work" -w /work "$IMAGE" sh -euxc '
            # which: test/util.py runs it, and the Fedora image does not ship it
            dnf install -y $DNF_ARGS gcc meson ninja-build pkg-config glib2-devel fuse3-devel \
              fuse3 openssh-server openssh-clients python3-pip which
            pip3 install pytest pytest-timeout
            meson setup build-rpm
            ninja -C build-rpm
            # test/util.py looks for the legacy name and skips the mount tests without it
            command -v fusermount || ln -s "$(command -v fusermount3)" /usr/bin/fusermount
            # run the tests as the owner of the bind mount, like the runner on the Ubuntu jobs
            useradd -m -u "$(stat -c %u /work)" -G wheel tester
            usermod -p "*" tester
            chown -R tester /work/build-rpm
            install -d -m 700 -o tester /home/tester/.ssh
            runuser -u tester -- ssh-keygen -t ed25519 -f /home/tester/.ssh/id_ed25519 -q -N ""
            install -m 600 -o tester /home/tester/.ssh/id_ed25519.pub /home/tester/.ssh/authorized_keys
            ssh-keygen -A
            touch /work/build-rpm/sshd.log
            chmod 644 /work/build-rpm/sshd.log
            # the PAM account check fails in these containers (pam_acct_mgmt returns 9)
            /usr/sbin/sshd -E /work/build-rpm/sshd.log -o LogLevel=VERBOSE -o UsePAM=no
            ls -l "$(command -v fusermount3)" /dev/fuse
            runuser -l tester -c "ssh -o ConnectionAttempts=10 -o StrictHostKeyChecking=no -o BatchMode=yes localhost true" || {
              runuser -l tester -c "ssh -v -o StrictHostKeyChecking=no -o BatchMode=yes localhost true" || true
              cat /work/build-rpm/sshd.log
              exit 1
            }
            runuser -l tester -c "cd /work/build-rpm && python3 -m pytest test/ --timeout=300 --maxfail=99 --junitxml=test-results.xml"
          '

      # A missing FUSE prerequisite makes the mount tests skip, not fail.
      - name: Check mount tests ran and none were skipped
        run: |
          python3 - build-rpm/test-results.xml <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          ran = sum(
              c.get("classname", "").endswith("test_sshfs") and c.find("skipped") is None
              for c in root.iter("testcase")
          )
          # xfail is reported as skipped too, but it is not a missing prerequisite
          skipped = sum(1 for s in root.iter("skipped") if s.get("type") != "pytest.xfail")
          print(f"{ran} mount tests ran, {skipped} skipped")
          if ran == 0 or skipped:
              print(f"::error::{ran} mount tests ran, {skipped} skipped")
              sys.exit(1)
          EOF

      - name: Note advisory failure
        if: failure()
        run: echo "::warning::${{ matrix.name }} runtime tests failed (advisory, not blocking)"

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.name }}
          path: |
            build-rpm/test-results.xml
            build-rpm/sshd.log
            build-rpm/meson-logs/

  fedora-rawhide:
    name: fedora-rawhide
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build in Fedora Rawhide container
        run: |
          docker run --rm -v "$PWD:/work" -w /work registry.fedoraproject.org/fedora:rawhide sh -euxc '
            dnf install -y gcc meson ninja-build pkg-config glib2-devel fuse3-devel
            meson setup build-rawhide -Dwerror=true
            ninja -C build-rawhide
          '

      - name: Upload build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: build-logs-fedora-rawhide
          path: build-rawhide/meson-logs/

  freebsd:
    name: freebsd-14
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          usesh: true
          prepare: |
            pkg install -y fusefs-libs3 glib meson ninja pkgconf
          run: |
            meson setup build-freebsd
            ninja -C build-freebsd

      - name: Upload build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: build-logs-freebsd
          path: build-freebsd/meson-logs/
