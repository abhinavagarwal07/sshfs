name: platform builds

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git ref to test, e.g. refs/pull/123/merge (optional)
        required: false

permissions:
  contents: read

# nothing here needs to save a cache, and dispatch runs may build other refs
cache-mode: read

concurrency:
  # dispatch runs get their own group so they can't cancel (or be cancelled by)
  # the run for the branch they were started from
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && format('dispatch-{0}', inputs.git-ref || github.ref)) || github.ref }}
  cancel-in-progress: true

jobs:
  # Pin a dispatched ref to one commit, so every job tests the same thing even
  # if refs/pull/N/merge moves while the run is going. git-ref is a full ref
  # name or a commit SHA; resolving the SHA once and passing that to every
  # workflow keeps them on the same commit too.
  resolve:
    name: resolve ref
    if: github.event_name == 'workflow_dispatch' && inputs.git-ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        env:
          GIT_REF: ${{ inputs.git-ref }}
        run: |
          set -euo pipefail
          if [[ "$GIT_REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$GIT_REF
          else
            if [[ "$GIT_REF" != refs/* ]] || ! git check-ref-format "$GIT_REF"; then
              echo "git-ref has to be a full ref name or a 40-hex commit SHA" >&2
              exit 1
            fi
            # ls-remote takes a pattern, so pick the exact ref (and, for an
            # annotated tag, the commit it points to)
            refs=$(git ls-remote --exit-code "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                     "$GIT_REF" "$GIT_REF^{}")
            sha=$(printf '%s\n' "$refs" | awk -v want="$GIT_REF" '
              $2 == want { direct = $1; n++ }
              $2 == want "^{}" { peeled = $1; p++ }
              END { if (n != 1 || p > 1) exit 1; print p ? peeled : direct }')
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "can't resolve $GIT_REF" >&2
            exit 1
          fi
          echo "$GIT_REF is $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  linux-compat:
    needs: resolve
    if: ${{ !failure() && !cancelled() }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            runner: ubuntu-latest
            run_tests: true
          - name: ubuntu-22.04
            runner: ubuntu-22.04
            run_tests: true
          - name: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
            run_tests: true
          - name: ubuntu-24.04-release
            runner: ubuntu-24.04
            buildtype: release
          - name: ubuntu-24.04-debug
            runner: ubuntu-24.04
            buildtype: debug
          - name: ubuntu-24.04-hardened
            runner: ubuntu-24.04
            extra_cflags: "-D_FORTIFY_SOURCE=3 -fstack-protector-strong"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Show tested commit
        run: |
          git rev-parse HEAD
          git cat-file -p HEAD | grep '^parent ' || true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc ninja-build pkg-config libglib2.0-dev libfuse3-dev ${{ matrix.run_tests && 'openssh-server openssh-client fuse3' || '' }}
          pip3 install meson==1.12.1 ${{ matrix.run_tests && 'pytest==9.1.1 pytest-timeout==2.4.0' || '' }}

      - name: Build
        env:
          CFLAGS: ${{ matrix.extra_cflags || '' }}
        run: |
          meson setup build ${{ matrix.buildtype && format('--buildtype={0}', matrix.buildtype) || '' }}
          ninja -C build

      - name: Setup SSH
        if: matrix.run_tests
        run: |
          chmod go-w ~
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -q -N ""
          cat ~/.ssh/id_ed25519.pub > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo sed -i 's/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh || sudo service ssh restart
          ssh -o StrictHostKeyChecking=no -o BatchMode=yes localhost true

      - name: Check FUSE availability
        if: matrix.run_tests
        run: |
          test -e /dev/fuse
          command -v fusermount3

      - name: Run tests
        if: matrix.run_tests
        timeout-minutes: 20
        run: |
          cd build
          python3 -m pytest test/ --timeout=300 --maxfail=99 --junitxml=test-results.xml

      - name: Upload test results
        if: matrix.run_tests && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.name }}
          path: |
            build/test-results.xml
            build/meson-logs/

      - name: Upload build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: build-logs-${{ matrix.name }}
          path: build/meson-logs/

  alpine-musl:
    needs: resolve
    if: ${{ !failure() && !cancelled() }}
    name: alpine-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Show tested commit
        run: |
          git rev-parse HEAD
          git cat-file -p HEAD | grep '^parent ' || true

      - name: Build in Alpine container
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.21@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d sh -euxc '
            apk add --no-cache gcc musl-dev meson ninja pkgconf glib-dev fuse3-dev
            meson setup build-alpine
            ninja -C build-alpine
          '

      - name: Upload build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: build-logs-alpine-musl
          path: build-alpine/meson-logs/

  freebsd:
    needs: resolve
    if: ${{ !failure() && !cancelled() }}
    name: freebsd-14
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Show tested commit
        run: |
          git rev-parse HEAD
          git cat-file -p HEAD | grep '^parent ' || true

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          release: '14.4'
          usesh: true
          prepare: |
            pkg install -y fusefs-libs3 glib meson ninja pkgconf
          run: |
            freebsd-version
            meson setup build-freebsd
            ninja -C build-freebsd

      - name: Upload build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: build-logs-freebsd
          path: build-freebsd/meson-logs/
